<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Herd · 리볼버 후보</title>
<style>
  :root { --ink: #ece4d6; --dim: #ab9f8d; --amber: #d39a4e; --panel: rgba(17, 15, 13, 0.88); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; color: var(--ink); overflow: hidden; background: #151413;
    font: 14px/1.45 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body[data-light=studio] { background: radial-gradient(120% 75% at 50% 38%, #4a494e 0%, #1b1a1c 72%); }
  body[data-light=day] { background: linear-gradient(#86a9d6 0%, #d3c6ae 50%, #b48d5f 100%); }
  body[data-light=night] { background: radial-gradient(90% 70% at 22% 72%, #2e1709 0%, #0c0807 55%, #050505 100%); }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  header { padding: max(10px, env(safe-area-inset-top)) 10px 6px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  header::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.38); color: var(--ink);
    padding: 8px 13px; border-radius: 999px; font: inherit; font-weight: 650; }
  .chip.on { background: var(--amber); color: #1b1309; border-color: var(--amber); }
  #stage { flex: 1; position: relative; min-height: 0; touch-action: none; cursor: grab; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; }
  #hint { position: absolute; left: 10px; top: 4px; color: var(--dim); font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  footer { background: var(--panel); border-top: 1px solid rgba(255,255,255,0.08); padding: 10px 12px max(12px, env(safe-area-inset-bottom)); }
  h1 { font: 700 17px/1.25 Georgia, "Noto Serif KR", serif; margin: 0 0 2px; }
  .tag { color: var(--amber); font-size: 12.5px; font-weight: 700; margin: 0 0 3px; }
  .sub { color: var(--dim); font-size: 12.5px; margin: 0 0 6px; }
  ul { margin: 0 0 8px; padding-left: 18px; font-size: 13.5px; } li { margin: 1px 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .btn { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 14px; background: #2d2925; color: var(--ink); }
  .btn.cock { background: #6b4320; } .btn.fire { background: #8e2b1c; }
  .btn.on { outline: 1px solid var(--amber); }
  #ammo { color: var(--dim); font-size: 12.5px; margin-left: 2px; }
  .seg { display: inline-flex; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); }
  .seg button { font: inherit; font-size: 13px; border: 0; padding: 8px 10px; background: transparent; color: var(--dim); }
  .seg button.on { background: rgba(211,154,78,0.28); color: var(--ink); }
  .pick { color: var(--dim); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .pick select { font: inherit; color: var(--ink); background: #2d2925; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 7px 8px; }
  #xhair { position: absolute; left: 50%; top: 50%; pointer-events: none; transform: translate(-50%, -50%); transition: opacity 0.12s; }
  #xhair.none { display: none; }
  #xhair.dot, #xhair.cocked, #xhair.muzzle { width: 4px; height: 4px; border-radius: 50%; background: rgba(255, 240, 220, 0.6); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45); }
  #xhair.cross { width: 15px; height: 15px; background:
    linear-gradient(rgba(255,240,220,0.55), rgba(255,240,220,0.55)) center 0 / 1px 5px no-repeat,
    linear-gradient(rgba(255,240,220,0.55), rgba(255,240,220,0.55)) center 100% / 1px 5px no-repeat,
    linear-gradient(rgba(255,240,220,0.55), rgba(255,240,220,0.55)) 0 center / 5px 1px no-repeat,
    linear-gradient(rgba(255,240,220,0.55), rgba(255,240,220,0.55)) 100% center / 5px 1px no-repeat; }
  .note { color: var(--dim); font-size: 11.5px; margin: 8px 0 0; }
</style>
</head>
<body data-light="studio">
<div id="app">
  <header id="guns"></header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="loading">불러오는 중…</div>
    <div id="hint">끌어서 돌리기 · 두 손가락으로 확대</div>
    <div id="xhair" class="none"></div>
  </div>
  <footer>
    <p class="tag" id="tag"></p>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <ul id="pts"></ul>
    <div class="row">
      <button class="btn cock" id="cock">공이치기</button>
      <button class="btn fire" id="fire">쏘기</button>
      <button class="btn" id="reload">채우기</button>
      <span id="ammo"></span>
    </div>
    <div class="row">
      <span class="seg" id="light"><button data-v="studio">스튜디오</button><button data-v="day">낮</button><button data-v="night">밤 랜턴</button></span>
      <span class="seg" id="view"><button data-v="side" class="on">오른쪽</button><button data-v="left">왼쪽</button><button data-v="fp">1인칭</button><button data-v="front">앞</button></span>
      <button class="btn on" id="spin">자동 회전</button>
    </div>
    <div class="row">
      <label class="pick">총소리 <select id="shotSel"><option value="now">① 지금 소리</option><option value="powder">② 흑색화약 쾅</option><option value="canyon">③ 사막 메아리</option><option value="ring">④ 귀 울림</option><option value="powderCrack" selected>⑤ ② + 팍 + 탕 조금 (여운 없음)</option><option value="powderCrack2">⑥ ② + 센 팍 (넓은 곳)</option><option value="powderTang">⑦ ⑤에 탕 더</option><option value="ref">⑧ 참고 영상 느낌</option><option value="powderRef">⑨ ⑤를 참고 영상 쪽으로</option></select></label>
      <label class="pick">탄피 소리 <select id="dropSel"><option value="dirt">① 흙에 툭</option><option value="rock" selected>② 돌에 팅</option><option value="both">③ 툭 + 작은 팅</option></select></label>
      <label class="pick">조준점 <select id="aimSel"><option value="none">① 없음</option><option value="dot">② 가운데 점</option><option value="cocked">③ 젖혔을 때만 점</option><option value="muzzle">④ 총구 따라가는 점</option><option value="cross">⑤ 얇은 십자</option></select></label>
    </div>
    <p class="note">총열 길이, 마감, 손잡이 재질은 제가 고른 임시 값이에요. 바꿀 수 있어요.</p>
  </footer>
</div>
<script src="revolvers.js"></script>
</body>
</html>

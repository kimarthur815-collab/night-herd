<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Herd · 밤 장면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
/* The night: no buttons and no numbers on screen. Only the cowboy's muttered lines, low in the middle. */
:root{color-scheme:dark;--bg:#050506;--ink:#e6e1d6;--dim:rgba(230,225,214,.62)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:none;background:var(--bg);color:var(--ink);overflow:hidden;font:16px/1.5 "Nanum Myeongjo",serif;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#fps{position:fixed;top:10px;right:14px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 1px 4px #000;display:none}
body.debug #fps{display:block}
#start,#pause,#end{position:fixed;inset:0;display:grid;place-items:center}
#start{background:rgba(5,5,6,.82);transition:opacity .9s;z-index:5}
#start.gone{opacity:0;pointer-events:none}
#pause{background:rgba(5,5,6,.7);z-index:6;opacity:0;pointer-events:none}
#pause.show{opacity:1;pointer-events:auto}
#end{background:#000;opacity:0;pointer-events:none;transition:opacity 1.4s;z-index:7}
#end.show{opacity:1;pointer-events:auto}
.card{text-align:center;padding:24px;max-width:520px}
.card h1{margin:0 0 6px;font-size:clamp(34px,6vw,48px);line-height:1.05;font-weight:700}
.card .sub{margin:0 0 22px;color:var(--dim);font-size:15px}
#loadTxt{margin:0 0 12px;color:var(--dim);font-size:15px;min-height:0}
/* 사용자: 로딩은 % 대신 회전초가 굴러감 (모양·속도 임시) */
#weed{position:relative;width:min(320px,70vw);height:56px;margin:0 auto 10px;overflow:hidden;transition:opacity .6s}
#weed::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:linear-gradient(90deg,transparent,rgba(230,225,214,.3),transparent)}
#weed .roll{position:absolute;bottom:7px;left:0;width:40px;height:40px;animation:weedX 3.6s linear infinite}
#weed .hop{width:40px;height:40px;animation:weedY 1.2s infinite}
#weed svg{display:block;animation:weedR 1.15s linear infinite}
#weed.done{opacity:0}
@keyframes weedX{from{transform:translateX(-48px)}to{transform:translateX(min(330px,72vw))}}
@keyframes weedY{0%,100%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}35%{transform:translateY(-13px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}70%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}82%{transform:translateY(-4px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}}
@keyframes weedR{to{transform:rotate(360deg)}}
/* 사용자: 로딩 중 팁 (글은 night-layout.js의 tips) */
#tip{margin:0 auto 20px;color:var(--dim);font-size:14px;line-height:1.6;min-height:4.8em;max-width:420px;transition:opacity .5s;text-wrap:pretty}
#tip b{color:var(--ink);font-weight:700;margin-right:6px}
#tip.fade{opacity:0}
.btn{min-height:48px;padding:10px 22px;border:1px solid rgba(230,225,214,.5);border-radius:999px;background:rgba(5,5,6,.55);color:var(--ink);font:700 16px "Nanum Myeongjo",serif;cursor:pointer;touch-action:none}
.btn:hover{border-color:rgba(230,225,214,.85)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn:disabled{opacity:.5;cursor:default}
#sub{position:fixed;left:50%;bottom:max(92px,14vh);transform:translateX(-50%);margin:0;font-size:clamp(17px,2.4vw,22px);color:var(--ink);opacity:0;transition:opacity .5s;pointer-events:none;text-shadow:0 2px 10px #000;white-space:nowrap}
#sub.show{opacity:1}
#ver{margin:18px 0 0;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
#turn{display:none;position:fixed;left:0;right:0;top:12px;margin:0;text-align:center;font-size:13px;color:var(--dim);pointer-events:none}
body.portrait #turn{display:block}
/* 사용자 2026-11-28: 가상 스틱 — 왼쪽 아래에 손가락을 댄 곳에만 희미하게 나타남 (크기·밝기 임시) */
#joy{position:fixed;left:0;top:0;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:1px solid rgba(230,225,214,.16);opacity:0;transition:opacity .25s;pointer-events:none;z-index:2}
#joy.show{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(230,225,214,.12);transform:translate(-50%,-50%)}
@media (prefers-reduced-motion: reduce){#start,#sub,#end{transition:none}#weed .roll,#weed .hop,#weed svg{animation:none}#weed .roll{left:calc(50% - 20px)}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fps">fps –</div>
<p id="turn">가로로 돌리면 더 넓게 보여요</p>
<p id="sub" aria-live="polite"></p>
<div id="joy" aria-hidden="true"><div id="knob"></div></div>
<div id="pause"><div class="card"><h1>멈춤</h1><p class="sub">밤 장면</p><button id="resume" class="btn" type="button">계속</button></div></div>
<div id="end"><div class="card"><h1>여기까지</h1><p class="sub">밤 장면은 여기서 끝나요</p><button id="again" class="btn" type="button">다시 하기</button></div></div>
<div id="start"><div class="card"><h1>Night Herd</h1><p class="sub">밤 장면</p><div id="weed" role="img" aria-label="불러오는 중"><div class="roll"><div class="hop"><svg viewBox="-22 -22 44 44" width="40" height="40"><g fill="none" stroke="#a08a66" stroke-width="1.1" stroke-linecap="round"><ellipse rx="19" ry="17"/><ellipse rx="17" ry="11" transform="rotate(35)"/><ellipse rx="16" ry="9" transform="rotate(-50)"/><ellipse rx="12" ry="18" transform="rotate(80)"/><ellipse rx="9" ry="14" transform="rotate(10)"/><ellipse rx="14" ry="6" transform="rotate(115)"/><path d="M-17 4c6-9 14-12 20-8s8 13 13 10M-12-12c4 7 1 14 7 18s12-2 16 4M-4 18c-3-8 2-14-3-21s-9-6-6-12M6-18c2 9 9 9 10 17"/><path d="M-20-3l-4-1M19 7l4 2M3 19l1 4M-7-18l-2-4M15-12l3-3" stroke-width="0.9"/></g></svg></div></div></div><p id="loadTxt" role="status"></p><p id="tip"></p><button id="startBtn" class="btn" type="button" disabled>불러오는 중</button><p id="ver">v0.024</p></div></div>
<script>if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch'); if (location.hash === '#debug') document.body.classList.add('debug');</script>
<script src="night.js?v=0.024"></script>
</body>
</html>
